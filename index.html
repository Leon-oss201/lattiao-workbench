<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手账">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="旅行手账">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>辣条旅行手账</title>
<style>
:root {
  --bg: #FDF8F3;
  --card: #FFFFFF;
  --text: #1F1B2E;
  --text-sec: #6B6574;
  --text-light: #9B96A6;
  --primary: #7C3AED;
  --primary-light: #EDE9FE;
  --accent: #EC4899;
  --accent-light: #FCE7F3;
  --border: #F0E6DD;
  --shadow: rgba(80, 50, 90, 0.06);
  --shadow-hover: rgba(80, 50, 90, 0.10);
  --radius-sm: 12px;
  --radius: 20px;
  --radius-lg: 28px;
  --safe-bottom: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow: hidden;
}

.app {
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
}

/* ============ Top Bar ============ */
.topbar {
  padding: 12px 20px 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-sec);
  font-weight: 500;
  letter-spacing: 0.5px;
}
.topbar .label { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 700; letter-spacing: 1px; }
.topbar .time { font-variant-numeric: tabular-nums; }
.topbar .icons { display: flex; gap: 4px; align-items: center; }
.battery {
  width: 22px; height: 11px; border: 1px solid var(--text-sec); border-radius: 3px;
  position: relative; padding: 1px;
}
.battery::after { content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 4px; background: var(--text-sec); border-radius: 0 1px 1px 0; }
.battery-fill { height: 100%; width: 75%; background: var(--text); border-radius: 1px; }

/* ============ Views ============ */
.views { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
.view { display: none; min-height: 100%; padding-bottom: 100px; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============ Header ============ */
.header { padding: 8px 20px 16px; }
.header h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.header h1 span { color: var(--primary); }
.header .sub { margin: 6px 0 0; font-size: 14px; color: var(--text-sec); }

/* ============ Calendar Strip ============ */
.calendar-strip {
  padding: 0 20px 16px;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.calendar-strip::-webkit-scrollbar { display: none; }
.cal-day {
  flex-shrink: 0;
  width: 54px; height: 72px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.cal-day .wd { font-size: 11px; color: var(--text-light); font-weight: 500; }
.cal-day .dn { font-size: 20px; font-weight: 700; color: var(--text); }
.cal-day.today { border-color: var(--primary); background: var(--primary-light); }
.cal-day.today .dn { color: var(--primary); }
.cal-day.selected { background: var(--primary); border-color: var(--primary); box-shadow: 0 6px 16px rgba(124,58,237,0.25); }
.cal-day.selected .wd, .cal-day.selected .dn { color: #fff; }
.cal-day.has-event::after {
  content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 2px;
}

/* ============ Section Title ============ */
.section-title {
  padding: 16px 20px 10px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.section-title h2 { margin: 0; font-size: 18px; font-weight: 700; }
.section-title .count { font-size: 12px; color: var(--text-light); font-weight: 500; }

/* ============ Timeline ============ */
.timeline { padding: 0 20px 20px; }
.timeline-empty {
  text-align: center; padding: 40px 20px; color: var(--text-light);
}
.timeline-empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
.timeline-item {
  display: flex;
  gap: 14px;
  margin-bottom: 18px;
}
.timeline-dot {
  width: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.timeline-dot .dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2.5px solid #fff;
  box-shadow: 0 0 0 1.5px var(--primary-light);
}
.timeline-dot .line {
  flex: 1; width: 2px; background: var(--border); margin-top: 6px;
}
.timeline-item:last-child .line { display: none; }
.timeline-time {
  font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.timeline-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: 0 4px 12px var(--shadow);
}
.timeline-card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.timeline-card p { margin: 0; font-size: 13px; color: var(--text-sec); line-height: 1.6; }
.timeline-card .imgs {
  display: flex; gap: 8px; margin-top: 10px; overflow-x: auto;
}
.timeline-card .imgs img {
  width: 84px; height: 84px; object-fit: cover; border-radius: 12px; flex-shrink: 0;
}

/* ============ Trip Cards ============ */
.trip-list { padding: 0 20px 20px; }
.trip-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 4px 14px var(--shadow);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.trip-card:active { transform: scale(0.985); }
.trip-card .cover {
  height: 150px; background: linear-gradient(135deg, var(--primary), var(--accent)); position: relative;
}
.trip-card .cover img { width: 100%; height: 100%; object-fit: cover; }
.trip-card .cover .tag {
  position: absolute; top: 12px; right: 12px;
  background: rgba(255,255,255,0.95); color: var(--primary);
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
}
.trip-card .info { padding: 14px; }
.trip-card .info h3 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
.trip-card .meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-light); }
.trip-card .meta span { display: flex; align-items: center; gap: 4px; }

/* ============ Small Cards (Archive) ============ */
.archive-list { padding: 0 20px 20px; }
.archive-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 3px 10px var(--shadow);
}
.archive-card .thumb {
  width: 64px; height: 64px; border-radius: 14px; background: var(--primary-light);
  flex-shrink: 0; overflow: hidden;
}
.archive-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.archive-card .thumb .emoji { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.archive-card .body { flex: 1; }
.archive-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
.archive-card .meta { font-size: 12px; color: var(--text-light); display: flex; gap: 10px; }
.archive-card .arrow { font-size: 18px; color: var(--text-light); }

/* ============ FAB ============ */
.fab {
  position: fixed; bottom: 100px; right: 20px;
  width: 54px; height: 54px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; font-size: 28px; border: none;
  box-shadow: 0 6px 20px rgba(124,58,237,0.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50;
}

/* ============ Bottom Tab ============ */
.bottom-tab {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index: 100;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.tab-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px;
  color: var(--text-light); font-size: 11px; font-weight: 500;
  cursor: pointer; transition: color 0.2s;
}
.tab-item .icon { font-size: 22px; line-height: 1; }
.tab-item.active { color: var(--primary); }

/* ============ Profile ============ */
.profile-header {
  padding: 8px 20px 20px;
  display: flex; align-items: center; gap: 16px;
}
.avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: #fff; flex-shrink: 0;
}
.profile-header .name h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
.profile-header .name p { margin: 0; font-size: 13px; color: var(--text-sec); }
.stats-row {
  padding: 0 20px 20px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.stat-box {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 8px; text-align: center; box-shadow: 0 3px 10px var(--shadow);
}
.stat-box .num { font-size: 22px; font-weight: 800; color: var(--primary); }
.stat-box .label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.menu-list { padding: 0 20px 20px; }
.menu-item {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  box-shadow: 0 2px 8px var(--shadow);
}
.menu-item .icon { font-size: 20px; }
.menu-item .text { flex: 1; font-size: 14px; font-weight: 600; }
.menu-item .arrow { color: var(--text-light); font-size: 16px; }

/* ============ Modal ============ */
.modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(31,27,46,0.45);
  align-items: flex-end; justify-content: center;
}
.modal.active { display: flex; }
.modal-sheet {
  width: 100%; max-width: 480px; max-height: 92vh;
  background: var(--bg);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  display: flex; flex-direction: column;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  padding: 18px 20px 12px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
.modal-header .close { font-size: 24px; color: var(--text-light); cursor: pointer; background: none; border: none; }
.modal-body { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }

/* ============ Forms ============ */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sec); margin-bottom: 6px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 12px 14px; font-size: 15px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--card); color: var(--text); font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: var(--primary);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn {
  width: 100%; padding: 14px; border-radius: var(--radius);
  border: none; font-size: 15px; font-weight: 700; cursor: pointer;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
.btn-secondary { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
.btn-danger { background: #FEE2E2; color: #DC2626; }

/* ============ Day Tabs ============ */
.day-tabs {
  display: flex; gap: 10px; padding: 0 20px 14px; overflow-x: auto;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  background: var(--card); border: 1.5px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--text-sec); cursor: pointer;
}
.day-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ============ Detail Header ============ */
.detail-header {
  padding: 0 20px 16px;
}
.detail-header .back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; color: var(--text-sec); margin-bottom: 10px; cursor: pointer;
}
.detail-header h1 { margin: 0 0 8px; font-size: 26px; font-weight: 700; }
.detail-header .meta { font-size: 13px; color: var(--text-light); display: flex; gap: 14px; }
.detail-cover {
  margin: 0 20px 16px; height: 200px; border-radius: var(--radius); overflow: hidden;
  background: linear-gradient(135deg, var(--primary), var(--accent));
}
.detail-cover img { width: 100%; height: 100%; object-fit: cover; }
.detail-actions {
  padding: 0 20px 16px; display: flex; gap: 10px;
}
.detail-actions .btn { flex: 1; font-size: 13px; padding: 10px; }

/* ============ Photos Grid ============ */
.photos-grid {
  padding: 0 20px 20px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.photos-grid img {
  width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; cursor: pointer;
}

/* ============ Image Upload ============ */
.img-upload {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 20px; text-align: center; color: var(--text-light); cursor: pointer;
  margin-bottom: 12px;
}
.img-preview {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.img-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; }

/* ============ Toast ============ */
.toast {
  position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
  background: rgba(31,27,46,0.9); color: #fff; padding: 10px 18px;
  border-radius: 24px; font-size: 13px; z-index: 300; display: none;
}

/* ============ Share Preview ============ */
.share-preview {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 16px;
}
.share-preview h3 { margin: 0 0 10px; font-size: 16px; }

/* Scrollbar hide */
::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div id="page-label" class="label">Journey Log</div>
    <div class="time" id="clock">18:03</div>
    <div class="icons">
      <span style="font-size:14px">📶</span>
      <span style="font-size:14px">📡</span>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="views" id="views">
    <!-- 日程视图 -->
    <div class="view active" id="view-schedule">
      <div class="header">
        <h1 id="schedule-title">5月3日</h1>
        <p class="sub" id="schedule-sub">今天的行程安排</p>
      </div>
      <div class="calendar-strip" id="calendar-strip"></div>
      <div class="section-title">
        <h2>今日行程</h2>
        <span class="count" id="today-count">0 项活动</span>
      </div>
      <div class="timeline" id="schedule-timeline"></div>
    </div>

    <!-- 行程视图 -->
    <div class="view" id="view-trips">
      <div class="header">
        <h1>我的行程</h1>
        <p class="sub">在途与归档，记录每一段旅程</p>
      </div>
      <div class="section-title">
        <h2>在途与待出发</h2>
        <span class="count" id="active-count">0 个行程</span>
      </div>
      <div class="trip-list" id="active-trips"></div>
      <div class="section-title">
        <h2>旅行归档</h2>
        <span class="count" id="archive-count">0 个行程</span>
      </div>
      <div class="archive-list" id="archive-trips"></div>
    </div>

    <!-- 我的视图 -->
    <div class="view" id="view-profile">
      <div class="profile-header">
        <div class="avatar">🧳</div>
        <div class="name">
          <h2>辣条的旅行</h2>
          <p>记录世界，收藏回忆</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="num" id="stat-trips">0</div><div class="label">行程</div></div>
        <div class="stat-box"><div class="num" id="stat-places">0</div><div class="label">目的地</div></div>
        <div class="stat-box"><div class="num" id="stat-photos">0</div><div class="label">照片</div></div>
      </div>
      <div class="menu-list">
        <div class="menu-item" onclick="openExport()">
          <span class="icon">📤</span><span class="text">导出备份</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="triggerImport()">
          <span class="icon">📥</span><span class="text">导入恢复</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="openShareModal()">
          <span class="icon">🔗</span><span class="text">分享设置</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="clearAllData()">
          <span class="icon">🗑️</span><span class="text">清空数据</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <!-- 详情视图 -->
    <div class="view" id="view-detail">
      <div class="detail-header">
        <div class="back" onclick="backToTrips()">‹ 返回行程</div>
        <h1 id="detail-title">象山两天一晚</h1>
        <div class="meta">
          <span id="detail-date">5月3日 - 5月4日</span>
          <span id="detail-place">📍 象山</span>
        </div>
      </div>
      <div class="detail-cover" id="detail-cover"></div>
      <div class="detail-actions">
        <button class="btn btn-secondary" onclick="editCurrentTrip()">✏️ 编辑</button>
        <button class="btn btn-secondary" onclick="exportTripShare()">📤 导出分享</button>
        <button class="btn btn-danger" onclick="deleteCurrentTrip()">🗑️ 删除</button>
      </div>
      <div class="day-tabs" id="day-tabs"></div>
      <div class="timeline" id="detail-timeline"></div>
    </div>
  </div>

  <button class="fab" id="fab" onclick="openAddTrip()">+</button>

  <div class="bottom-tab">
    <div class="tab-item active" data-view="schedule" onclick="switchTab('schedule')">
      <span class="icon">📅</span><span>日程</span>
    </div>
    <div class="tab-item" data-view="trips" onclick="switchTab('trips')">
      <span class="icon">🧳</span><span>行程</span>
    </div>
    <div class="tab-item" data-view="profile" onclick="switchTab('profile')">
      <span class="icon">👤</span><span>我的</span>
    </div>
  </div>
</div>

<!-- Add/Edit Trip Modal -->
<div class="modal" id="trip-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="modal-title">新建行程</h2>
      <button class="close" onclick="closeModal('trip-modal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>行程标题</label>
        <input type="text" id="trip-title" placeholder="例如：象山两天一晚">
      </div>
      <div class="form-group">
        <label>目的地</label>
        <input type="text" id="trip-place" placeholder="例如：象山">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>开始日期</label>
          <input type="date" id="trip-start">
        </div>
        <div class="form-group">
          <label>结束日期</label>
          <input type="date" id="trip-end">
        </div>
      </div>
      <div class="form-group">
        <label>封面图</label>
        <div class="img-upload" onclick="document.getElementById('cover-input').click()">
          <div id="cover-placeholder">点击上传封面图</div>
          <img id="cover-preview" style="display:none;max-width:100%;border-radius:12px;margin-top:8px;">
        </div>
        <input type="file" id="cover-input" accept="image/*" style="display:none" onchange="handleCoverUpload(event)">
      </div>
      <div class="form-group">
        <label>每日安排</label>
        <div id="days-editor"></div>
      </div>
      <button class="btn btn-primary" onclick="saveTrip()">保存行程</button>
    </div>
  </div>
</div>

<!-- Day Activity Modal -->
<div class="modal" id="activity-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="activity-modal-title">添加活动</h2>
      <button class="close" onclick="closeModal('activity-modal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>时间</label>
        <input type="time" id="act-time">
      </div>
      <div class="form-group">
        <label>标题</label>
        <input type="text" id="act-title" placeholder="例如：出发去象山">
      </div>
      <div class="form-group">
        <label>备注 / 攻略 / 感受</label>
        <textarea id="act-note" rows="4" placeholder="记录路线、攻略、餐厅推荐或当下感受..."></textarea>
      </div>
      <div class="form-group">
        <label>照片</label>
        <input type="file" id="act-images" accept="image/*" multiple style="display:none" onchange="handleActivityImages(event)">
        <div class="img-upload" onclick="document.getElementById('act-images').click()">点击添加照片</div>
        <div class="img-preview" id="act-img-preview"></div>
      </div>
      <button class="btn btn-primary" onclick="saveActivity()">保存活动</button>
    </div>
  </div>
</div>

<!-- Image Viewer -->
<div class="modal" id="image-modal" onclick="closeModal('image-modal')">
  <div class="modal-sheet" style="background: rgba(0,0,0,0.95); border-radius: 0; max-height: 100vh;">
    <img id="viewer-img" style="width:100%; height:100%; object-fit: contain;">
  </div>
</div>

<!-- Export Modal -->
<div class="modal" id="export-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>导出备份</h2>
      <button class="close" onclick="closeModal('export-modal')">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-sec);margin-bottom:12px;">复制下方 JSON 文本保存到安全位置，可用于数据恢复。</p>
      <textarea id="export-text" rows="10" style="font-size:12px;" readonly></textarea>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="copyExport()">复制到剪贴板</button>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal" id="import-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>导入恢复</h2>
      <button class="close" onclick="closeModal('import-modal')">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-sec);margin-bottom:12px;">粘贴之前导出的 JSON 文本：</p>
      <textarea id="import-text" rows="10" style="font-size:12px;" placeholder="粘贴 JSON 数据..."></textarea>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="doImport()">确认导入</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImportFile(event)">
<div class="toast" id="toast"></div>

<script>
// ============ Service Worker ============
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg) { console.log('SW registered:', reg.scope); })
      .catch(function(err) { console.warn('SW registration failed:', err); });
  });
}

// ============ Data ============
var STORAGE_KEY = 'lattiao_travel_v3';
var trips = [];
var selectedDate = new Date();
var editingTripId = null;
var editingDayIndex = null;
var editingActivityIndex = null;
var currentTripId = null;
var currentDayIndex = 0;
var tempActivityImages = [];
var tempCoverImage = null;

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) trips = JSON.parse(raw);
  } catch (e) { trips = []; }
  if (!Array.isArray(trips)) trips = [];
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trips));
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function formatDate(d) {
  var date = new Date(d + 'T00:00:00');
  return (date.getMonth() + 1) + '月' + date.getDate() + '日';
}

function formatDateFull(d) {
  var date = new Date(d + 'T00:00:00');
  var wd = ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
  return (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + wd;
}

function formatRange(start, end) {
  return formatDate(start) + ' - ' + formatDate(end);
}

function daysDiff(a, b) {
  var da = new Date(a + 'T00:00:00');
  var db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}

function addDays(dateStr, n) {
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function isSameDay(a, b) {
  return a === b;
}

function compressImage(file, maxWidth, quality, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ============ Navigation ============
function switchTab(view) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.tab-item[data-view="' + view + '"]').classList.add('active');

  var labels = { schedule: 'Journey Log', trips: 'Journey Archive', profile: 'My Journey' };
  document.getElementById('page-label').textContent = labels[view];

  var fab = document.getElementById('fab');
  fab.style.display = (view === 'trips' || view === 'schedule') ? 'flex' : 'none';

  if (view === 'schedule') renderSchedule();
  if (view === 'trips') renderTrips();
  if (view === 'profile') renderProfile();
}

function backToTrips() {
  switchTab('trips');
}

// ============ Schedule View ============
function renderSchedule() {
  var title = document.getElementById('schedule-title');
  var sub = document.getElementById('schedule-sub');
  title.textContent = formatDateFull(selectedDate.toISOString().split('T')[0]).split(' ')[0];
  sub.textContent = formatDateFull(selectedDate.toISOString().split('T')[0]);
  renderCalendarStrip();
  renderScheduleTimeline();
}

function renderCalendarStrip() {
  var strip = document.getElementById('calendar-strip');
  strip.innerHTML = '';
  var today = new Date();
  for (var i = -3; i <= 3; i++) {
    var d = new Date(selectedDate);
    d.setDate(d.getDate() + i);
    var ds = d.toISOString().split('T')[0];
    var wd = ['日','一','二','三','四','五','六'][d.getDay()];
    var div = document.createElement('div');
    div.className = 'cal-day';
    if (isSameDay(ds, today.toISOString().split('T')[0])) div.classList.add('today');
    if (isSameDay(ds, selectedDate.toISOString().split('T')[0])) div.classList.add('selected');
    if (hasAnyEvent(ds)) div.classList.add('has-event');
    div.innerHTML = '<span class="wd">' + wd + '</span><span class="dn">' + d.getDate() + '</span>';
    div.onclick = (function(dateStr) { return function() { selectedDate = new Date(dateStr + 'T00:00:00'); renderSchedule(); }; })(ds);
    strip.appendChild(div);
  }
}

function hasAnyEvent(dateStr) {
  for (var i = 0; i < trips.length; i++) {
    var t = trips[i];
    for (var d = 0; d < t.days.length; d++) {
      if (t.days[d].date === dateStr && t.days[d].activities.length > 0) return true;
    }
  }
  return false;
}

function renderScheduleTimeline() {
  var container = document.getElementById('schedule-timeline');
  var ds = selectedDate.toISOString().split('T')[0];
  var allActs = [];
  trips.forEach(function(t) {
    t.days.forEach(function(day) {
      if (day.date === ds) {
        day.activities.forEach(function(a) {
          allActs.push({ trip: t, activity: a });
        });
      }
    });
  });
  allActs.sort(function(a, b) { return (a.activity.time || '00:00').localeCompare(b.activity.time || '00:00'); });

  document.getElementById('today-count').textContent = allActs.length + ' 项活动';

  if (allActs.length === 0) {
    container.innerHTML = '<div class="timeline-empty"><div class="icon">🌴</div><div>这一天还没有安排</div><div style="font-size:12px;margin-top:6px;">去"行程"里添加一段旅程吧</div></div>';
    return;
  }

  container.innerHTML = '';
  allActs.forEach(function(item) {
    var el = createTimelineItem(item.activity);
    container.appendChild(el);
  });
}

function createTimelineItem(activity) {
  var item = document.createElement('div');
  item.className = 'timeline-item';
  var imgs = '';
  if (activity.images && activity.images.length > 0) {
    imgs = '<div class="imgs">' + activity.images.map(function(img) {
      return '<img src="' + img + '" onclick="openImage(this.src)">';
    }).join('') + '</div>';
  }
  item.innerHTML =
    '<div class="timeline-dot"><div class="dot"></div><div class="line"></div></div>' +
    '<div class="timeline-card">' +
      '<div class="timeline-time">' + (activity.time || '全天') + '</div>' +
      '<h3>' + escapeHtml(activity.title) + '</h3>' +
      '<p>' + escapeHtml(activity.note || '') + '</p>' + imgs +
    '</div>';
  return item;
}

function escapeHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ Trips View ============
function renderTrips() {
  var today = todayStr();
  var active = trips.filter(function(t) { return t.endDate >= today; });
  var archive = trips.filter(function(t) { return t.endDate < today; });

  document.getElementById('active-count').textContent = active.length + ' 个行程';
  document.getElementById('archive-count').textContent = archive.length + ' 个行程';

  var activeContainer = document.getElementById('active-trips');
  activeContainer.innerHTML = '';
  if (active.length === 0) {
    activeContainer.innerHTML = '<div class="timeline-empty"><div class="icon">✈️</div><div>还没有在途行程</div></div>';
  } else {
    active.forEach(function(t) { activeContainer.appendChild(createTripCard(t)); });
  }

  var archiveContainer = document.getElementById('archive-trips');
  archiveContainer.innerHTML = '';
  if (archive.length === 0) {
    archiveContainer.innerHTML = '<div class="timeline-empty" style="padding:20px;"><div style="font-size:32px;">📒</div><div style="font-size:13px;">暂无归档</div></div>';
  } else {
    archive.forEach(function(t) { archiveContainer.appendChild(createArchiveCard(t)); });
  }
}

function createTripCard(t) {
  var div = document.createElement('div');
  div.className = 'trip-card';
  var status = t.startDate > todayStr() ? '待出发' : '进行中';
  var cover = t.coverImage ? '<img src="' + t.coverImage + '">' : '';
  div.innerHTML =
    '<div class="cover">' + cover + '<div class="tag">' + status + '</div></div>' +
    '<div class="info">' +
      '<h3>' + escapeHtml(t.title) + '</h3>' +
      '<div class="meta">' +
        '<span>📅 ' + formatRange(t.startDate, t.endDate) + '</span>' +
        '<span>📍 ' + escapeHtml(t.destination) + '</span>' +
      '</div>' +
    '</div>';
  div.onclick = function() { openTripDetail(t.id); };
  return div;
}

function createArchiveCard(t) {
  var div = document.createElement('div');
  div.className = 'archive-card';
  var thumb = t.coverImage
    ? '<div class="thumb"><img src="' + t.coverImage + '"></div>'
    : '<div class="thumb"><div class="emoji">📍</div></div>';
  div.innerHTML =
    thumb +
    '<div class="body">' +
      '<h3>' + escapeHtml(t.title) + '</h3>' +
      '<div class="meta">' +
        '<span>📅 ' + formatRange(t.startDate, t.endDate) + '</span>' +
        '<span>📍 ' + escapeHtml(t.destination) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="arrow">›</div>';
  div.onclick = function() { openTripDetail(t.id); };
  return div;
}

// ============ Detail View ============
function openTripDetail(id) {
  currentTripId = id;
  currentDayIndex = 0;
  var t = trips.find(function(x) { return x.id === id; });
  if (!t) return;

  document.getElementById('detail-title').textContent = t.title;
  document.getElementById('detail-date').textContent = formatRange(t.startDate, t.endDate);
  document.getElementById('detail-place').textContent = '📍 ' + t.destination;

  var cover = document.getElementById('detail-cover');
  cover.innerHTML = t.coverImage ? '<img src="' + t.coverImage + '">' : '';

  renderDayTabs(t);
  renderDetailTimeline(t);

  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('view-detail').classList.add('active');
  document.getElementById('page-label').textContent = 'Trip Detail';
  document.getElementById('fab').style.display = 'none';
}

function renderDayTabs(t) {
  var container = document.getElementById('day-tabs');
  container.innerHTML = '';
  t.days.forEach(function(day, idx) {
    var tab = document.createElement('div');
    tab.className = 'day-tab' + (idx === currentDayIndex ? ' active' : '');
    tab.textContent = 'DAY ' + (idx + 1);
    tab.onclick = function() { currentDayIndex = idx; renderDayTabs(t); renderDetailTimeline(t); };
    container.appendChild(tab);
  });
}

function renderDetailTimeline(t) {
  var container = document.getElementById('detail-timeline');
  var day = t.days[currentDayIndex];
  if (!day) { container.innerHTML = ''; return; }

  if (day.activities.length === 0) {
    container.innerHTML = '<div class="timeline-empty"><div class="icon">📝</div><div>这一天还没有记录</div><button class="btn btn-primary" style="margin-top:14px;" onclick="openAddActivity(' + currentDayIndex + ')">添加活动</button></div>';
    return;
  }

  var acts = day.activities.slice().sort(function(a, b) { return (a.time || '00:00').localeCompare(b.time || '00:00'); });
  container.innerHTML = '';
  acts.forEach(function(a, idx) {
    var item = createTimelineItem(a);
    item.style.cursor = 'pointer';
    item.onclick = function() { openEditActivity(currentDayIndex, idx); };
    container.appendChild(item);
  });
}

// ============ Add/Edit Trip ============
function openAddTrip() {
  editingTripId = null;
  document.getElementById('modal-title').textContent = '新建行程';
  document.getElementById('trip-title').value = '';
  document.getElementById('trip-place').value = '';
  var today = todayStr();
  document.getElementById('trip-start').value = today;
  document.getElementById('trip-end').value = addDays(today, 1);
  tempCoverImage = null;
  document.getElementById('cover-preview').style.display = 'none';
  document.getElementById('cover-placeholder').textContent = '点击上传封面图';
  buildDaysEditor(today, addDays(today, 1));
  document.getElementById('trip-modal').classList.add('active');
}

function editCurrentTrip() {
  var t = trips.find(function(x) { return x.id === currentTripId; });
  if (!t) return;
  editingTripId = t.id;
  document.getElementById('modal-title').textContent = '编辑行程';
  document.getElementById('trip-title').value = t.title;
  document.getElementById('trip-place').value = t.destination;
  document.getElementById('trip-start').value = t.startDate;
  document.getElementById('trip-end').value = t.endDate;
  tempCoverImage = t.coverImage || null;
  if (tempCoverImage) {
    document.getElementById('cover-preview').src = tempCoverImage;
    document.getElementById('cover-preview').style.display = 'block';
    document.getElementById('cover-placeholder').textContent = '';
  } else {
    document.getElementById('cover-preview').style.display = 'none';
    document.getElementById('cover-placeholder').textContent = '点击上传封面图';
  }
  buildDaysEditor(t.startDate, t.endDate, t.days);
  document.getElementById('trip-modal').classList.add('active');
}

function buildDaysEditor(start, end, existingDays) {
  var container = document.getElementById('days-editor');
  container.innerHTML = '';
  var days = daysDiff(start, end) + 1;
  if (days < 1) days = 1;
  for (var i = 0; i < days; i++) {
    var ds = addDays(start, i);
    var dayData = existingDays && existingDays[i] ? existingDays[i] : { date: ds, activities: [] };
    var div = document.createElement('div');
    div.className = 'timeline-card';
    div.style.marginBottom = '12px';
    div.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
        '<div><div style="font-size:12px;color:var(--primary);font-weight:700;">DAY ' + (i + 1) + '</div>' +
        '<div style="font-size:13px;color:var(--text-sec);">' + formatDate(ds) + '</div></div>' +
        '<button class="btn btn-secondary" style="width:auto;padding:8px 12px;font-size:12px;" onclick="openAddActivity(' + i + ')">+ 添加活动</button>' +
      '</div>' +
      '<div id="day-acts-' + i + '"></div>';
    container.appendChild(div);
    renderEditorDayActivities(i, dayData.activities);
  }
}

function renderEditorDayActivities(dayIndex, activities) {
  var container = document.getElementById('day-acts-' + dayIndex);
  if (!container) return;
  if (activities.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-light);padding:6px 0;">暂无活动</div>';
    return;
  }
  container.innerHTML = activities.map(function(a, idx) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">' +
      '<div><b>' + (a.time || '全天') + '</b> ' + escapeHtml(a.title) + '</div>' +
      '<span style="color:var(--primary);cursor:pointer;" onclick="openEditActivityFromEditor(' + dayIndex + ',' + idx + ')">编辑</span>' +
    '</div>';
  }).join('');
}

function handleCoverUpload(event) {
  var file = event.target.files[0];
  if (!file) return;
  compressImage(file, 1200, 0.75, function(dataUrl) {
    tempCoverImage = dataUrl;
    document.getElementById('cover-preview').src = dataUrl;
    document.getElementById('cover-preview').style.display = 'block';
    document.getElementById('cover-placeholder').textContent = '';
  });
}

function onDateChanged() {
  var start = document.getElementById('trip-start').value;
  var end = document.getElementById('trip-end').value;
  if (!start || !end) return;
  if (end < start) {
    end = start;
    document.getElementById('trip-end').value = end;
  }
  buildDaysEditor(start, end);
}

document.getElementById('trip-start').addEventListener('change', onDateChanged);
document.getElementById('trip-end').addEventListener('change', onDateChanged);

function saveTrip() {
  var title = document.getElementById('trip-title').value.trim();
  var place = document.getElementById('trip-place').value.trim();
  var start = document.getElementById('trip-start').value;
  var end = document.getElementById('trip-end').value;
  if (!title || !place || !start || !end) {
    showToast('请填写完整信息'); return;
  }

  var days = [];
  var dayCount = daysDiff(start, end) + 1;
  var oldDays = [];
  if (editingTripId) {
    var old = trips.find(function(x) { return x.id === editingTripId; });
    if (old) oldDays = old.days;
  }

  for (var i = 0; i < dayCount; i++) {
    var ds = addDays(start, i);
    var acts = oldDays[i] ? oldDays[i].activities : [];
    days.push({ date: ds, activities: acts });
  }

  if (editingTripId) {
    var t = trips.find(function(x) { return x.id === editingTripId; });
    t.title = title; t.destination = place; t.startDate = start; t.endDate = end;
    t.coverImage = tempCoverImage;
    t.days = days;
  } else {
    trips.push({
      id: generateId(), title: title, destination: place,
      startDate: start, endDate: end, coverImage: tempCoverImage, days: days
    });
  }

  saveData();
  closeModal('trip-modal');
  showToast('行程已保存');
  switchTab('trips');
}

function deleteCurrentTrip() {
  if (!confirm('确定删除这个行程吗？')) return;
  trips = trips.filter(function(t) { return t.id !== currentTripId; });
  saveData();
  showToast('行程已删除');
  switchTab('trips');
}

// ============ Activity Editor ============
function openAddActivity(dayIndex) {
  editingDayIndex = dayIndex;
  editingActivityIndex = null;
  document.getElementById('activity-modal-title').textContent = '添加活动';
  document.getElementById('act-time').value = '08:00';
  document.getElementById('act-title').value = '';
  document.getElementById('act-note').value = '';
  tempActivityImages = [];
  document.getElementById('act-img-preview').innerHTML = '';
  document.getElementById('activity-modal').classList.add('active');
}

function openEditActivity(dayIndex, actIndex) {
  var t = trips.find(function(x) { return x.id === currentTripId; });
  var a = t.days[dayIndex].activities[actIndex];
  editingDayIndex = dayIndex;
  editingActivityIndex = actIndex;
  document.getElementById('activity-modal-title').textContent = '编辑活动';
  document.getElementById('act-time').value = a.time || '08:00';
  document.getElementById('act-title').value = a.title;
  document.getElementById('act-note').value = a.note || '';
  tempActivityImages = a.images || [];
  document.getElementById('act-img-preview').innerHTML = tempActivityImages.map(function(img) {
    return '<img src="' + img + '">';
  }).join('');
  document.getElementById('activity-modal').classList.add('active');
}

function openEditActivityFromEditor(dayIndex, actIndex) {
  // For editing inside trip modal, find activity from existing days
  var start = document.getElementById('trip-start').value;
  var oldDays = [];
  if (editingTripId) {
    var old = trips.find(function(x) { return x.id === editingTripId; });
    if (old) oldDays = old.days;
  }
  var a = oldDays[dayIndex] && oldDays[dayIndex].activities[actIndex] ? oldDays[dayIndex].activities[actIndex] : null;
  editingDayIndex = dayIndex;
  editingActivityIndex = actIndex;
  document.getElementById('activity-modal-title').textContent = a ? '编辑活动' : '添加活动';
  document.getElementById('act-time').value = a && a.time ? a.time : '08:00';
  document.getElementById('act-title').value = a ? a.title : '';
  document.getElementById('act-note').value = a ? (a.note || '') : '';
  tempActivityImages = a ? (a.images || []) : [];
  document.getElementById('act-img-preview').innerHTML = tempActivityImages.map(function(img) {
    return '<img src="' + img + '">';
  }).join('');
  document.getElementById('activity-modal').classList.add('active');
}

function handleActivityImages(event) {
  var files = event.target.files;
  for (var i = 0; i < files.length; i++) {
    compressImage(files[i], 1200, 0.7, function(dataUrl) {
      tempActivityImages.push(dataUrl);
      refreshActivityImagePreview();
    });
  }
}

function refreshActivityImagePreview() {
  document.getElementById('act-img-preview').innerHTML = tempActivityImages.map(function(img) {
    return '<img src="' + img + '">';
  }).join('');
}

function saveActivity() {
  var time = document.getElementById('act-time').value;
  var title = document.getElementById('act-title').value.trim();
  var note = document.getElementById('act-note').value.trim();
  if (!title) { showToast('请填写活动标题'); return; }

  var activity = { time: time, title: title, note: note, images: tempActivityImages };

  // Check if we're in trip modal or detail view
  var modalActive = document.getElementById('trip-modal').classList.contains('active');

  if (modalActive) {
    // Editing within trip creation modal - use existing trip data or temp
    if (editingTripId) {
      var t = trips.find(function(x) { return x.id === editingTripId; });
      if (editingActivityIndex !== null) {
        t.days[editingDayIndex].activities[editingActivityIndex] = activity;
      } else {
        t.days[editingDayIndex].activities.push(activity);
      }
      buildDaysEditor(t.startDate, t.endDate, t.days);
    } else {
      showToast('请先保存行程，再添加活动'); return;
    }
  } else {
    var t = trips.find(function(x) { return x.id === currentTripId; });
    if (!t) return;
    if (editingActivityIndex !== null) {
      t.days[editingDayIndex].activities[editingActivityIndex] = activity;
    } else {
      t.days[editingDayIndex].activities.push(activity);
    }
    saveData();
    renderDetailTimeline(t);
  }

  closeModal('activity-modal');
  showToast('活动已保存');
}

// ============ Profile & Data ============
function renderProfile() {
  var totalTrips = trips.length;
  var places = new Set();
  var photos = 0;
  trips.forEach(function(t) {
    places.add(t.destination);
    t.days.forEach(function(d) {
      d.activities.forEach(function(a) {
        photos += (a.images || []).length;
      });
    });
    if (t.coverImage) photos += 1;
  });
  document.getElementById('stat-trips').textContent = totalTrips;
  document.getElementById('stat-places').textContent = places.size;
  document.getElementById('stat-photos').textContent = photos;
}

function openExport() {
  document.getElementById('export-text').value = JSON.stringify(trips, null, 2);
  document.getElementById('export-modal').classList.add('active');
}

function copyExport() {
  document.getElementById('export-text').select();
  document.execCommand('copy');
  showToast('已复制到剪贴板');
}

function triggerImport() {
  document.getElementById('import-modal').classList.add('active');
}

function doImport() {
  var text = document.getElementById('import-text').value.trim();
  if (!text) { showToast('请输入数据'); return; }
  try {
    var data = JSON.parse(text);
    if (!Array.isArray(data)) { showToast('数据格式错误'); return; }
    if (confirm('导入将覆盖现有数据，确定继续吗？')) {
      trips = data;
      saveData();
      showToast('导入成功');
      closeModal('import-modal');
      switchTab('schedule');
    }
  } catch (e) {
    showToast('JSON 解析失败');
  }
}

function handleImportFile(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('import-text').value = e.target.result;
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (confirm('确定清空所有行程数据吗？此操作不可恢复！')) {
    trips = []; saveData();
    showToast('数据已清空');
    switchTab('schedule');
  }
}

function openShareModal() {
  showToast('在行程详情页点击「导出分享」即可生成独立页面');
}

function exportTripShare() {
  var t = trips.find(function(x) { return x.id === currentTripId; });
  if (!t) return;
  var html = buildShareHTML(t);
  var blob = new Blob([html], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = t.title + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('分享页面已下载');
}

function buildShareHTML(t) {
  var daysHtml = t.days.map(function(day, idx) {
    var acts = day.activities.slice().sort(function(a, b) { return (a.time || '00:00').localeCompare(b.time || '00:00'); });
    var actsHtml = acts.map(function(a) {
      var imgs = (a.images || []).map(function(img) { return '<img src="' + img + '" style="width:120px;height:120px;object-fit:cover;border-radius:10px;margin:4px;">'; }).join('');
      return '<div style="margin-bottom:18px;padding-left:16px;border-left:3px solid #7C3AED;">' +
        '<div style="font-size:13px;color:#7C3AED;font-weight:700;">' + (a.time || '全天') + '</div>' +
        '<div style="font-size:16px;font-weight:700;margin:4px 0;">' + escapeHtml(a.title) + '</div>' +
        '<div style="font-size:14px;color:#555;line-height:1.6;">' + escapeHtml(a.note || '').replace(/\n/g,'<br>') + '</div>' +
        '<div style="margin-top:8px;">' + imgs + '</div>' +
      '</div>';
    }).join('');
    return '<h2 style="font-size:18px;margin:24px 0 12px;">DAY ' + (idx + 1) + ' · ' + formatDate(day.date) + '</h2>' + actsHtml;
  }).join('');

  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>' + escapeHtml(t.title) + '</title>' +
    '<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#FDF8F3;color:#1F1B2E;margin:0;padding:0;} .wrap{max-width:680px;margin:0 auto;padding:24px;} .cover{height:260px;border-radius:20px;background:linear-gradient(135deg,#7C3AED,#EC4899);overflow:hidden;margin-bottom:20px;} .cover img{width:100%;height:100%;object-fit:cover;} h1{font-size:28px;margin:0 0 8px;} .meta{color:#6B6574;font-size:14px;margin-bottom:20px;} </style></head><body>' +
    '<div class="wrap"><div class="cover">' + (t.coverImage ? '<img src="' + t.coverImage + '">' : '') + '</div>' +
    '<h1>' + escapeHtml(t.title) + '</h1>' +
    '<div class="meta">📍 ' + escapeHtml(t.destination) + ' &nbsp;|&nbsp; 📅 ' + formatRange(t.startDate, t.endDate) + '</div>' +
    daysHtml +
    '<div style="margin-top:40px;text-align:center;font-size:12px;color:#999;">由 辣条旅行手账 生成</div>' +
    '</div></body></html>';
}

// ============ Image Viewer ============
function openImage(src) {
  document.getElementById('viewer-img').src = src;
  document.getElementById('image-modal').classList.add('active');
}

// ============ Modal Utils ============
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

document.getElementById('trip-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('trip-modal');
});
document.getElementById('activity-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('activity-modal');
});

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2200);
}

function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
}

// ============ Init ============
loadData();
updateClock();
setInterval(updateClock, 60000);
renderSchedule();
